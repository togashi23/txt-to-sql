<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TSV to SQL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <form class="col s12">
          <div class="row">
            <div class="input-field col s6">
              <i class="material-icons prefix">table_view</i>
              <input id="table-name" type="text" class="validate" />
              <label for="table-name">テーブル名</label>
            </div>
          </div>

          <div class="row">
            <div class="col s12">
              <div class="editor-label"><i class="material-icons">article</i>TSVテキスト</div>
              <div id="text-input" class="editor"></div>
            </div>
          </div>

          <div class="row center">
            <a id="create" class="waves-effect waves-light btn"><i class="material-icons right">create</i>作成</a>
          </div>

          <div class="row">
            <div class="col s12">
              <div class="editor-label"><i class="material-icons">note_add</i>SQL</div>
              <div id="sql-output" class="editor"></div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="main.js"></script>
  </body>
</html>
