<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>TSV to SQL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
  </head>
  <body>
    <header class="app-bar">
      <h1 class="app-title">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="12" cy="6" rx="7.5" ry="2.5" />
          <path d="M4.5 6v12a7.5 2.5 0 0 0 15 0V6" />
          <path d="M4.5 10a7.5 2.5 0 0 0 15 0M4.5 14a7.5 2.5 0 0 0 15 0" />
        </svg>
        TSV to SQL
      </h1>

      <div class="field">
        <label class="field-label" for="table-name">テーブル名</label>
        <input
          id="table-name"
          type="text"
          class="text-input"
          placeholder="table_name"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="field field-fixed">
        <label class="field-label" for="dbms">DBMS</label>
        <select id="dbms" class="select">
          <option value="sqlserver">SQL Server</option>
          <option value="mysql">MySQL</option>
        </select>
      </div>

      <label class="checkbox" title="トランザクションで囲んで出力する">
        <input id="use-transaction" type="checkbox" checked />
        トランザクション
      </label>

      <button id="theme-toggle" type="button" class="btn btn-icon" title="テーマを切り替え" aria-label="テーマを切り替え">
        <i data-lucide="sun" class="icon icon-sun"></i>
        <i data-lucide="moon" class="icon icon-moon"></i>
      </button>
    </header>

    <main class="panes">
      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">
            <i data-lucide="table-2" class="icon"></i>
            TSVテキスト
          </span>
        </div>
        <div id="text-input" class="editor"></div>
      </section>

      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">
            <i data-lucide="file-text" class="icon"></i>
            SQL
          </span>
          <button id="copy" type="button" class="btn btn-ghost">
            <i data-lucide="copy" class="icon"></i>
            <span id="copy-label">コピー</span>
          </button>
        </div>
        <div id="sql-output" class="editor"></div>
      </section>
    </main>

    <footer class="action-bar">
      <button id="create" type="button" class="btn btn-primary">
        <i data-lucide="play" class="icon"></i>
        作成
      </button>
      <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
    </footer>

    <script type="module" src="main.ts"></script>
  </body>
</html>
